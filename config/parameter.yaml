# Beispiel-Parameter fuer das LCOH-Tool.
# Alle Zahlenwerte sind Platzhalter und noch mit Green Wind / der Betreuung
# abzustimmen.

projektname: "Direktanschluss Windpark an Waermeerzeuger (Parameterbeispiel)"

windpark:
  # Quelle 1 (Standard): projektbezogene CSV, z. B. aus dem Ertragsgutachten
  quelle: csv
  erzeugungsprofil_pfad: "data/erzeugungsprofil_beispiel.csv"
  # Quelle 2: Schnellabschaetzung mit windpowerlib (grob, ersetzt kein Gutachten).
  # Setup: pip install -e ".[wind]"
  # quelle: windpowerlib
  # windpowerlib:
  #   breitengrad: 53.6
  #   laengengrad: 10.6
  #   jahr: 2023
  #   anlagentyp: "E-141/4200"   # Name aus der windpowerlib-Anlagendatenbank
  #   nabenhoehe_m: 129
  #   anzahl_anlagen: 3
  #   parkwirkungsgrad: 0.9
  #   # era5: Copernicus CDS (CDS-Account noetig, auch kommerziell nutzbar) - Standard
  #   # open_meteo: nur fuer Demo/nicht-kommerziell (Lizenz der kostenlosen API)
  #   # csv: eigene Wetterdatei (wetter_pfad, wind_messhoehe_m)
  #   wetterquelle: era5

waermebedarf:
  # Vorrang 1: projektbezogene CSV (stundenscharf)
  waermelast_pfad: "data/waermelast_beispiel.csv"
  # Vorrang 2 (waermelast_pfad auskommentieren): Profil aus Gebaeudetypen ueber
  # lpagg (VDI 4655 / BDEW, DWD-Testreferenzjahr). Setup: pip install -e ".[lpagg]"
  # lpagg:
  #   try_region: 4             # DWD-TRY-Region 1..15 (4 = Potsdam)
  #   jahr: 2027
  #   feiertage_bundesland: SH
  #   gebaeude:
  #     EFH:
  #       house_type: EFH
  #       q_heiz_a_kwh: 15000   # je Gebaeude
  #       anzahl: 40
  #       n_pers: 3
  #       n_we: 1
  #       sigma: 4              # Zeitversatz der Kopien (Gleichzeitigkeit)
  #     MFH:
  #       house_type: MFH
  #       q_heiz_a_kwh: 80000
  #       anzahl: 5
  #       n_pers: 30
  #       n_we: 10
  #       sigma: 2
  # Vorrang 3: nur Jahreswert, einfaches saisonales Platzhalter-Muster
  # jahreswaermebedarf_mwh: 3500

waermepumpe:
  jazl: 3.2            # Jahresarbeitszahl
  nennleistung_kw: 800

backup:
  typ: "elektrodenkessel"
  wirkungsgrad: 0.98
  nennleistung_kw: 1000

speicher:
  kapazitaet_kwh: 5000
  verlust_pro_stunde: 0.002

wirtschaft:
  wacc: 0.05
  abschreibungsdauer_jahre: 20
  strompreisszenario_aktiv: "realistisch"  # best_case | realistisch | worst_case
  strompreisszenarien:
    best_case_eur_pro_mwh: 70
    realistisch_eur_pro_mwh: 90
    worst_case_eur_pro_mwh: 130
  netzentgelt_eur_pro_mwh: 40
  capex_waermepumpe_eur: 600000
  capex_backup_eur: 150000
  capex_speicher_eur: 200000
  capex_anschluss_eur: 400000
  opex_fix_eur_pro_jahr: 30000

regulatorik:
  netzentgeltbefreiung_direktanschluss: true

fossile_referenz:
  aktiv: true
  wirkungsgrad_kessel: 0.9
  brennstoffpreis_eur_pro_mwh: 70
  capex_eur: 250000
